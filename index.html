<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VNOx by verma0x</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for Monospace Aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tone.js for Audio Synthesis -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <style>
        /* Base Styling & CSS Box Model Setup */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', monospace;
            background-color: #030008; /* Deep dark background */
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fixed Background Canvas */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0; /* Hidden until init */
            transition: opacity 2s ease-in;
        }

        /* Neon Purple Glow Effects */
        .neon-text-primary {
            color: #fff;
            text-shadow: 
                0 0 5px #b026ff, 
                0 0 10px #b026ff, 
                0 0 20px #b026ff, 
                0 0 40px #b026ff;
        }

        .neon-btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #b026ff;
            background: transparent;
            border: 2px solid #b026ff;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 
                0 0 10px #b026ff, 
                inset 0 0 10px #b026ff;
            text-shadow: 0 0 5px #b026ff;
            transition: all 0.3s ease;
            cursor: pointer;
            outline: none;
        }

        .neon-btn:hover, .neon-btn:focus {
            background-color: #b026ff;
            color: #ffffff;
            box-shadow: 
                0 0 20px #b026ff, 
                0 0 40px #b026ff, 
                inset 0 0 15px #ffffff;
            text-shadow: 0 0 5px #ffffff;
        }

        /* Blinking Cursor for Typewriter */
        .cursor {
            display: inline-block;
            width: 12px;
            height: 1em;
            background-color: #b026ff;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
            box-shadow: 0 0 8px #b026ff;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Fade Animations */
        .fade-in {
            animation: fadeIn 1.5s ease-in forwards;
        }
        
        .fade-out {
            animation: fadeOut 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeOut {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(1.1); pointer-events: none; }
        }

        /* Layout Containers */
        #initScreen {
            position: absolute;
            z-index: 50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background-color: #030008;
        }

        #mainContent {
            z-index: 10;
            max-width: 800px;
            padding: 2rem;
            text-align: center;
            display: none; /* Hidden until init */
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            background: rgba(3, 0, 8, 0.7);
            border: 1px solid rgba(176, 38, 255, 0.2);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(176, 38, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        .desc-text {
            font-size: 1.125rem;
            line-height: 1.7;
            color: #c7a3e8; /* Muted purple text */
            text-shadow: 0 0 2px rgba(176, 38, 255, 0.5);
            max-width: 600px;
            opacity: 0; /* Handled by JS */
        }
    </style>
</head>
<body>

    <!-- Background Digital Rain Canvas -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Initialization Screen (Required to unlock Web Audio API) -->
    <div id="initScreen">
        <button id="connectBtn" class="neon-btn">[ INITIATE CONNECTION ]</button>
    </div>

    <!-- Main Landing Content -->
    <div id="mainContent">
        <h1 class="text-4xl md:text-5xl font-bold tracking-tight">
            <span id="titleText" class="neon-text-primary"></span><span class="cursor" id="cursor"></span>
        </h1>
        
        <p id="descriptionText" class="desc-text hidden">
            Your server is under attack. Read each code snippet, find the flaw, and choose the patch that closes it before the timer runs out. Fix at least three of five to keep the server secured.
        </p>

        <div id="ctaContainer" class="hidden mt-4">
            <a href="https://verma0x.github.io/vnox/" class="neon-btn">Play Game</a>
        </div>
    </div>

    <script>
        /** 
         * 1. BACKGROUND CANVAS ANIMATION (Neon Purple Digital Rain)
         */
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let columns;
        const fontSize = 16;
        let drops = [];

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.floor(width / fontSize);
            drops = [];
            for (let x = 0; x < columns; x++) {
                drops[x] = Math.random() * height; // Start at random positions
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const characters = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*';

        function drawMatrix() {
            // Dark background with slight opacity for trailing effect
            ctx.fillStyle = 'rgba(3, 0, 8, 0.1)';
            ctx.fillRect(0, 0, width, height);

            // Neon purple text
            ctx.fillStyle = 'rgba(176, 38, 255, 0.6)'; // Faint neon purple #b026ff
            ctx.font = fontSize + 'px "Fira Code", monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = characters.charAt(Math.floor(Math.random() * characters.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                // Reset drop to top randomly
                if (drops[i] * fontSize > height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            requestAnimationFrame(drawMatrix);
        }

        /**
         * 2. AUDIO SYNTHESIS (Tone.js)
         */
        let ambientSynth, typingSynth;

        function initAudio() {
            // Continuous low futuristic hum
            const chorus = new Tone.Chorus(4, 2.5, 0.5).start();
            const reverb = new Tone.Reverb({ decay: 5, wet: 0.6 });
            
            ambientSynth = new Tone.FMSynth({
                harmonicity: 0.5,
                modulationIndex: 1.2,
                oscillator: { type: 'sine' },
                modulation: { type: 'triangle' },
                envelope: { attack: 2, decay: 0.1, sustain: 1, release: 2 }
            }).chain(chorus, reverb, Tone.Destination);
            
            // Lower volume for ambient track
            ambientSynth.volume.value = -18; 

            // Mechanical typing sound (Noise Synth for sharp clicks)
            typingSynth = new Tone.NoiseSynth({
                noise: { type: 'pink' },
                envelope: { attack: 0.001, decay: 0.05, sustain: 0, release: 0.01 }
            }).toDestination();
            typingSynth.volume.value = -10;
        }

        /**
         * 3. TYPEWRITER ANIMATION & LOGIC
         */
        const titleText = "Vulnerability Hunter";
        const titleElement = document.getElementById('titleText');
        const descElement = document.getElementById('descriptionText');
        const ctaElement = document.getElementById('ctaContainer');
        
        let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < titleText.length) {
                // Append character
                titleElement.textContent += titleText.charAt(typeIndex);
                
                // Play typing sound
                if (typingSynth) {
                    // Slight pitch variation for mechanical feel
                    typingSynth.triggerAttackRelease("32n", Tone.now(), Math.random() * 0.5 + 0.5); 
                }

                typeIndex++;
                
                // Randomize typing speed for realism (30ms to 120ms)
                const typingSpeed = Math.floor(Math.random() * 90) + 30;
                setTimeout(typeWriter, typingSpeed);
            } else {
                // Typing finished, reveal description and button
                setTimeout(() => {
                    descElement.classList.remove('hidden');
                    descElement.classList.add('fade-in');
                    
                    setTimeout(() => {
                        ctaElement.classList.remove('hidden');
                        ctaElement.classList.add('fade-in');
                    }, 800); // Stagger the CTA button fade in
                }, 500);
            }
        }

        /**
         * 4. INITIALIZATION SEQUENCE
         */
        const connectBtn = document.getElementById('connectBtn');
        const initScreen = document.getElementById('initScreen');
        const mainContent = document.getElementById('mainContent');

        connectBtn.addEventListener('click', async () => {
            // Start Web Audio API Context
            await Tone.start();
            initAudio();

            // Start background hum
            ambientSynth.triggerAttack("C2");

            // Transition UI
            initScreen.classList.add('fade-out');
            
            setTimeout(() => {
                initScreen.style.display = 'none';
                mainContent.style.display = 'flex';
                canvas.style.opacity = '1';
                
                // Start visual matrix
                drawMatrix();
                
                // Start typing sequence
                setTimeout(typeWriter, 500);
            }, 500);
        });

    </script>
</body>
</html>
